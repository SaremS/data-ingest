[package]
name = "databus"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.1"
arrayvec = "0.7.6"
dashmap = "6.2.1"
futures = "0.3.32"
im = "15.1.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"

[dev-dependencies]
bytes = "1.11.1"
criterion = { version = "0.7.0", features = ["async_tokio"] }

[[bench]]
name = "latency"
harness = false
